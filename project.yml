# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: TeslaLink
options:
  bundleIdPrefix: com.teslalink
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  TeslaLinkCore:
    path: Packages/TeslaLinkCore
targets:
  TeslaLink:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: TeslaLinkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TESLALINK_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(TESLALINK_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
schemes:
  TeslaLink:
    build:
      targets:
        TeslaLink: all
# Core logic tests run without Xcode:  cd Packages/TeslaLinkCore && swift test
